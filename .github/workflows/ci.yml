name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency: # cancel superseded runs to save iteration time
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # No Postgres service container, deliberately — see DECISIONS.md.
    #
    # Phase 0 stood one up because PLAN.md required it by Phase 3. Gate 3.4 then
    # established that Phase 3's premise does not hold: the engine has no
    # data-agreement or schema-negotiation layer, and its Postgres source stanza was
    # verified by reading the code rather than by needing a live database. So the
    # container was provisioning a database on every push that nothing connected to.
    #
    # Restoring it is a few lines if a Postgres-backed test ever lands, and the two
    # non-obvious details are kept in DECISIONS.md rather than lost with the config:
    # pkg/analysis builds its connection string with no host, so lib/pq needs PGHOST
    # and PGPORT in env; and PGHOST must be 127.0.0.1 rather than localhost, because
    # the service container publishes on IPv4 while localhost resolves to [::1].
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # Phase 0 prerequisite (1). -race is not optional here: the engine runs a
      # goroutine per partition, and Phase 3's streaming ingress adds a feed
      # goroutine alongside them. -count=1 disables test caching so CI always
      # re-runs the suite rather than reporting a cached pass.
      #
      # -timeout is stated rather than left to Go's 10m default, which this suite
      # outgrew: pkg/recovery panicked at that default having measured everything
      # correctly, and pkg/windowing passed at 490s with under two minutes of room.
      # Neither is a slow test to be fixed by waiting — these packages re-run the
      # engine tens of times to re-measure every published claim from scratch, and a
      # two-core runner under -race takes ~5x what a laptop does. 30m is a ceiling
      # for a runaway, not a budget: if a package approaches it, the fix is to look
      # at what it is re-measuring, not to raise this number.
      - run: go test ./... -race -count=1 -timeout 30m
      # Phase 0 prerequisite (3), and the SOLE enforcement of both halves that the
      # binding tests do not cover. The binding tests catch a broken claim assertion;
      # this step catches an invalid claim set (gen-claims runs claims.Check and exits
      # non-zero) AND a recorded number that moved without CLAIMS.md being regenerated
      # (the git diff). internal/claimset used to duplicate both as unit tests; they
      # were removed because re-measuring every claim made that package the critical
      # path of the -race suite at ~277s. See internal/claimset/claimset.go — if this
      # step is ever weakened, that check has to come back somewhere.
      - name: CLAIMS.md is generated, not hand-written
        run: |
          go run ./cmd/gen-claims
          git diff --exit-code -- CLAIMS.md \
            || { echo "::error::CLAIMS.md is stale — run 'go run ./cmd/gen-claims' and commit"; exit 1; }
