name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, 07:00 UTC. The -race suite runs here, off the per-push path — see the `race`
    # job and DECISIONS.md ("Splitting -race off the merge gate").
    - cron: '0 7 * * *'
  workflow_dispatch: # so the -race suite can be triggered by hand between nightlies

concurrency: # cancel superseded runs to save iteration time
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The merge gate: everything except the race detector, on every push and PR. It re-measures
  # every claim (the test suite's binding tests, then gen-claims for the staleness check), so
  # it is not fast in absolute terms — but dropping -race takes it off the ~5x multiplier and
  # roughly halves it versus the old single -race job that pkg/damping's 7x32x8000 sweep
  # pinned at ~16 minutes on its own.
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # No Postgres service container, deliberately — see DECISIONS.md.
    #
    # Phase 0 stood one up because PLAN.md required it by Phase 3. Gate 3.4 then
    # established that Phase 3's premise does not hold: the engine has no
    # data-agreement or schema-negotiation layer, and its Postgres source stanza was
    # verified by reading the code rather than by needing a live database. So the
    # container was provisioning a database on every push that nothing connected to.
    #
    # Restoring it is a few lines if a Postgres-backed test ever lands, and the two
    # non-obvious details are kept in DECISIONS.md rather than lost with the config:
    # pkg/analysis builds its connection string with no host, so lib/pq needs PGHOST
    # and PGPORT in env; and PGHOST must be 127.0.0.1 rather than localhost, because
    # the service container publishes on IPv4 while localhost resolves to [::1].
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # No -race here — that is the nightly `race` job. This still catches every logic and
      # claim regression; only data races are deferred to nightly, and they can only live in
      # the pinned upstream engine (this repo adds no concurrency of its own beyond calling
      # the engine's ensembler), so per-push race coverage bought little.
      #
      # -count=1 disables test caching so CI always re-runs rather than reporting a cached
      # pass. -timeout is a runaway ceiling, not a budget: these packages re-run the engine
      # tens of times to re-measure every published claim, so they are minutes, not seconds.
      # If a package approaches the ceiling, the fix is to look at what it re-measures.
      - run: go test ./... -count=1 -timeout 20m
      # The SOLE enforcement of both halves that the binding tests do not cover. The binding
      # tests catch a broken claim assertion; this step catches an invalid claim set
      # (gen-claims runs claims.Check and exits non-zero) AND a recorded number that moved
      # without CLAIMS.md being regenerated (the git diff). internal/claimset used to
      # duplicate both as unit tests; they were removed because re-measuring every claim made
      # that package the critical path. See internal/claimset/claimset.go — if this step is
      # ever weakened, that check has to come back somewhere.
      - name: CLAIMS.md is generated, not hand-written
        run: |
          go run ./cmd/gen-claims
          git diff --exit-code -- CLAIMS.md \
            || { echo "::error::CLAIMS.md is stale — run 'go run ./cmd/gen-claims' and commit"; exit 1; }

  # The race detector, moved OFF the merge gate to nightly. -race is not optional for this
  # engine — it runs a goroutine per partition, and the ensembler runs members concurrently —
  # but on a two-core runner it multiplies the suite ~5x, and it re-validates the SAME pinned
  # upstream concurrency on every push. Nightly catches a race within a day, which is the
  # right trade for a repo whose own changes are pure config and in-process analysis. Trigger
  # it by hand (workflow_dispatch) after any change that does touch concurrency.
  race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # -short skips the packages whose only cost is re-measuring claims through SMC, which
      # under -race times out the per-package limit on a two-core runner (pkg/offline runs 24
      # calibrations). Those packages add no concurrency of their own; the engine concurrency
      # the race detector needs is covered by pkg/recovery and pkg/windowing, which are not
      # skipped. The skipped packages' claims are verified fully in the non-race `test` gate.
      - run: go test ./... -race -short -count=1 -timeout 30m
